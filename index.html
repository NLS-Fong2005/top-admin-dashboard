<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TOP Admin Dashboard</title>
        <link rel="stylesheet" href="./assets/style.css">
    </head>
    <body>
        <!-- Sidebar -->
        <div class="sidebar">
            <div>
                Logo
                <h1>Dashboard</h1>
            </div>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Messages</li>
                <li>History</li>
                <li>Tasks</li>
                <li>Communities</li>
                <li>Settings</li>
                <li>Support</li>
                <li>Privacy</li>
            </ul>
        </div>

        <!-- Header: Flex -->
        <div class="header">
            <div class="top-half">
                <div class="searchbar"></div>
                <div class="user-profile">
                    <div>notification-bell</div>
                    <div>profile image</div>
                    <div>Morgan Oakley</div>
                </div>
            </div> <!--top-half-->

            <!-- Bottom Half:  -->
            <div class="bottom-half">
                <div class="user-block">
                    <div>profile image</div>
                    <div class="user-greeting">
                        <p>Hi there,</p>
                        <p>Morgan Oakley (@morgan)</p>
                    </div>
                    
                </div>

                <div class="buttons">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>
        </div>
        <div class="content">
            <h2>Projects</h2>
            <div class="projects">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>

            <h2>announcements</h2>
            <div class="announcements"></div>

            <h2>Trending</h2>
            <div class="trending"></div>
        </div>
    </body>
</html>
