<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TOP Admin Dashboard</title>
        <link rel="stylesheet" href="./assets/style.css">
    </head>
    <body>
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="dashboard-container">
                <img src="./assets/web-icons/view-dashboard.svg" alt="Dashboard Logo" class="web-icon">
                <h1>Dashboard</h1>
            </div>
            <ul>
                <li><img src="./assets/web-icons/home.svg" alt="Home"> Home</li>
                <li><img src="./assets/web-icons/card-account-details-outline.svg" alt="Profile"> Profile</li>
                <li><img src="./assets/web-icons/message-reply.svg" alt="Messages">Messages</li>
                <li><img src="./assets/web-icons/clock-time-three.svg" alt="History">History</li>
                <li><img src="./assets/web-icons/note-multiple.svg" alt="Tasks">Tasks</li>
                <li><img src="./assets/web-icons/account-group.svg" alt="Communities">Communities</li>
                <li><img src="./assets/web-icons/cog.svg" alt="Settings">Settings</li>
                <li><img src="./assets/web-icons/help-box.svg" alt="Support">Support</li>
                <li><img src="./assets/web-icons/shield.svg" alt="">Privacy</li>
            </ul>
        </div>

        <!-- Header: Flex -->
        <div class="header">
            <div class="top-half">
                <div class="searchbar"></div>
                <div class="user-profile">
                    <div>notification-bell</div>
                    <div>profile image</div>
                    <div>Morgan Oakley</div>
                </div>
            </div> <!--top-half-->

            <!-- Bottom Half:  -->
            <div class="bottom-half">
                <div class="user-block">
                    <div>profile image</div>
                    <div class="user-greeting">
                        <p>Hi there,</p>
                        <p>Morgan Oakley (@morgan)</p>
                    </div>
                    
                </div>

                <div class="buttons">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>
        </div>
        <div class="content">
            <h2>Projects</h2>
            <div class="projects">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>

            <h2>announcements</h2>
            <div class="announcements"></div>

            <h2>Trending</h2>
            <div class="trending"></div>
        </div>
    </body>
</html>
